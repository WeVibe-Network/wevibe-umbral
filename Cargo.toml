[package]
name = "wevibe-umbral"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/WeVibe-Network/wevibe-umbral"
homepage = "https://github.com/WeVibe-Network/wevibe-umbral"
license = "GPL-3.0"

[lib]
name = "wevibe_umbral"
path = "src/lib.rs"

[[bin]]
name = "wevibe-umbral"
path = "src/main.rs"

[workspace]
members = ["crates/core"]
# crates/wasm is its own workspace root on purpose: [profile.*] in a workspace
# MEMBER is silently ignored, and the wasm build needs opt-level="z" + lto +
# panic="abort" to hit its size target. Those settings must not leak onto the
# native binary, so the wasm crate stays excluded.
exclude = ["crates/wasm"]

[dependencies]
# All Umbral crypto lives in the core crate, shared byte-for-byte with the
# WASM build that ships inside wevibe-mcp. Do not add umbral-pre calls here.
wevibe-umbral-core = { path = "crates/core" }
umbral-pre = { version = "0.11.0", features = ["default-serialization", "serde"] }
generic-array = "1.4"
tonic = "0.14.5"
prost = "0.14"
tonic-prost = "0.14.5"
rmp-serde = "1.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
sha2 = "0.11"
dashmap = "6.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.14.5"
